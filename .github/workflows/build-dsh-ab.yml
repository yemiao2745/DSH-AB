# DSH-AB - one release per DSH-AB version, holding one installer per upstream dsh version.
#
# ---------------------------------------------------------------------------------------------
# THIS WORKFLOW CANNOT BE VALIDATED ON THE DEVELOPMENT MACHINE. Its first real run happens on
# GitHub, and the first run is the experiment: watch it in the Actions tab.
#
# Checked locally: the YAML parses; every local command in it is the same one that is known to
# work there (go test ./... -count=1 in src\dsh-ab, build\build.ps1 -DshVersion <ver> [-Offline],
# build\verify-silent.ps1, and the discover block run against fed-in version and asset lists);
# every PowerShell block in it parses. NOT checked: the runner image, the toolchain download URLs,
# actions/setup-go, the upstream API responses, the cache behaviour and the release publication.
#
# Release shape: the tag is dshab-<DSH-AB version>, so one DSH-AB version owns exactly one release
# and every installer is an asset of it. A (DSH-AB, dsh) pair whose asset is already there is
# skipped instead of rebuilt, so a daily poll with nothing new builds and publishes nothing.
#
# Triggers: repository_dispatch (upstream webhook or a manual API call), a daily schedule, and
# workflow_dispatch. Schedule and repository_dispatch only fire from the DEFAULT branch, so this
# file has to be on it before either does anything.
#
# Credentials: the implicit GITHUB_TOKEN (permissions: contents: write below). No repository secret
# is configured and none is needed. This repository never contains, reads or prints
# .secrets\github.toml - that file is git-ignored and stays on the development machine.
# ---------------------------------------------------------------------------------------------

name: build-dsh-ab

on:
  repository_dispatch:
    # curl -X POST -H "Authorization: Bearer <token>" \
    #   https://api.github.com/repos/<owner>/DSH-AB/dispatches \
    #   -d '{"event_type":"dsh-ab-build"}'
    # The payload may carry {"dsh_versions":"0.1.5-rc.2,0.1.2-rc.1"} to build a subset.
    types: [dsh-ab-build]
  schedule:
    # Daily poll so a new upstream release shows up without anyone remembering to dispatch.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dsh_versions:
        description: 'dsh versions to build, comma separated (empty = every upstream release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-dsh-ab
  cancel-in-progress: false

jobs:
  discover:
    name: discover upstream dsh versions
    runs-on: windows-latest
    outputs:
      versions: ${{ steps.rc.outputs.versions }}
      has_work: ${{ steps.rc.outputs.has_work }}
      # 更新包与 dsh 版本无关（Release 里就一份），缺了这一份也算有工作要做。
      update_pack_needed: ${{ steps.rc.outputs.update_pack_needed }}
      # 更新包那个 job 要传一个 dsh 版本给 build.ps1（随包那份 exe 里编着它），但那个 job 不解析
      # 任何 dsh 树，所以这只是个标签，不是「要取到那份 dsh」。
      pack_dsh_version: ${{ steps.rc.outputs.pack_dsh_version }}
      dshab: ${{ steps.rc.outputs.dshab }}
      tag: ${{ steps.rc.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List the upstream releases this release does not carry yet
        id: rc
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSIONS: ${{ github.event.inputs.dsh_versions }}
          DISPATCH_VERSIONS: ${{ github.event.client_payload.dsh_versions }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{ 'User-Agent' = 'dsh-ab-ci'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $($env:GH_TOKEN)" }

          # This program's version and its one release tag. The value is read from
          # src\dsh-ab\VERSION - the file build\mkpayload.ps1 reads into payload-manifest.json's
          # dshab_version. That manifest is git-ignored and does not exist yet at this point, so the
          # version is taken at its source instead of being written down here.
          $dshab = (Get-Content -LiteralPath 'src\dsh-ab\VERSION' -Raw).Trim()
          if (-not $dshab) { throw 'src\dsh-ab\VERSION 是空的' }
          $tag = "dshab-$dshab"
          Write-Host "dshab $dshab -> release $tag"

          # Upstream tags look like dsh-v<version>; the version without that prefix is the npm
          # version the payload is built from. One matrix cell per release, on every channel: an
          # alpha, an rc and a final release without a suffix are all accepted - the channel a
          # version is on is not this workflow's business, only that the version exists.
          $requested = if ($env:MANUAL_VERSIONS) { $env:MANUAL_VERSIONS } else { $env:DISPATCH_VERSIONS }
          $versions = @()
          if ($requested) {
            Write-Host "versions asked for by the trigger: $requested"
            foreach ($v in ($requested -split '[,\s]+')) {
              if ($v) { $versions += ($v.Trim() -replace '^dsh-v', '') }
            }
          } else {
            $uri = 'https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=100'
            $releases = Invoke-RestMethod -Uri $uri -Headers $headers
            foreach ($rel in @($releases)) {
              # Assigned per iteration, so $Matches always belongs to the tag just matched.
              if ($rel.tag_name -match '^dsh-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') { $versions += $Matches[1] }
            }
          }

          $versions = @($versions | Sort-Object -Unique)
          if ($versions.Count -eq 0) { throw 'no dsh version found (upstream API, or the list the trigger asked for)' }
          Write-Host "$($versions.Count) dsh version(s): $($versions -join ', ')"

          # An asset of the release is what says "this (DSH-AB, dsh) pair is published": the name
          # is the one build\build.ps1 gives the installer. A release that is not there yet answers
          # 404 and counts as nothing published.
          function Get-AssetName([string]$DshVersion) { "DSH-AB-$dshab-$DshVersion-setup.exe" }
          $existing = @()
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
          } catch {
            # 只有 404 才等于「这个 Release 还不存在」。403 / 429 / 5xx / 网络故障以前也被当成它，
            # 于是 asset 清单空转成「一个都没发布」：一次限流就能把日常空跑变成整轮 12 格全量重建，
            # 并把内容相同的安装包再 --clobber 传一遍。别的失败一律往上抛，让这一轮红掉而不是乱建。
            $status = 0
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
            Write-Host "release $tag does not exist yet: $($_.Exception.Message)"
          }
          # asset 清单单独取，不靠 Release 响应里那一小块，而且按 release id 取、翻页取：publish 读同一个
          # Release 的 asset 用的是 .../releases/<id>/assets --paginate，这里只看第一页就是两处口径不一致，
          # asset 一多「已发布」的判定会静默少数，同一份安装包被反复重建重传。（/releases/tags/<tag>/assets
          # 这个路径不存在，实测 404，所以 id 不是可选的美化。）
          if ($release) {
            $page = 1
            while ($true) {
              $batch = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100&page=$page" -Headers $headers |
                         ForEach-Object { $_.name })
              $existing += $batch
              if ($batch.Count -lt 100) { break }
              $page += 1
            }
            Write-Host "release $tag already has $($existing.Count) asset(s)"
          }
          $pending = @($versions | Where-Object { $existing -notcontains (Get-AssetName $_) })
          $skipped = @($versions | Where-Object { $existing -contains (Get-AssetName $_) })
          if ($skipped.Count -gt 0) { Write-Host "already published, skipped: $($skipped -join ', ')" }
          if ($pending.Count -gt 0) { Write-Host "to build: $($pending -join ', ')" }
          else { Write-Host 'nothing to build: every asset of this release is published' }

          # 就地更新包与 dsh 版本无关，一个 DSH-AB 版本一份，所以「待构建的格子一个都没有」不代表
          # 没事可做：matrix 整片 skipped 时没有格子会顺手做它，Release 里缺的就是这一份。缺了就算
          # 有工作，由下面 update-pack job 补出来。
          $updateAsset = "DSH-AB-$dshab-update.zip"
          $updatePackNeeded = if ($existing -notcontains $updateAsset) { 'true' } else { 'false' }

          # 更新包那个 job 用 -ProgramOnly 组装载荷（不解析任何 dsh 树），但随包那份 exe 里还是要编
          # 一个 dsh 版本（versionText 已经没有「空 dsh 版本」这一路），所以这里给它一个标签：本 Release
          # 已经带着的安装包里的最新那个，Release 还没有就取本轮要建的最新那个。它**不是**「要取到那份
          # dsh」——npm 上取不到任何 dsh，那个 job 照样能造出更新包来。
          $carried = @($existing | Where-Object { $_ -match "^DSH-AB-$([regex]::Escape($dshab))-(.+)-setup\.exe$" } |
                       ForEach-Object { $Matches[1] })
          $packDsh = @($carried + $pending + $versions | Sort-Object)[-1]
          Write-Host "update pack exe label (a dsh version this release carries): $packDsh"
          if ($updatePackNeeded -eq 'true') { Write-Host "the update pack $updateAsset is not in the release yet" }

          # Built by hand: ConvertTo-Json turns a one-element array into a scalar, and the matrix
          # needs an array. has_work is what skips the build job when there is nothing new.
          $json = '[' + (($pending | ForEach-Object { '"' + $_ + '"' }) -join ',') + ']'
          $hasWork = if ($pending.Count -gt 0) { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "versions=$json"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_work=$hasWork"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "update_pack_needed=$updatePackNeeded"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "pack_dsh_version=$packDsh"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dshab=$dshab"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

  test:
    # The program's own tests, on the same Go release the build job downloads into tools\go: the
    # module lives in src\dsh-ab (the repository root is not a Go module). The icon tests are part
    # of this run - they keep a broken .ico from shipping - and a failing test blocks the build
    # below, so nothing unverified is released.
    name: go test (src\dsh-ab)
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Provide the Go toolchain (actions/setup-go)
        uses: actions/setup-go@v5
        with:
          # Keep in step with $GoVersion in build\provision-go.ps1, the toolchain every build job
          # installs into tools\go (that file is the one place the version is written down now).
          go-version: '1.24.0'
          cache-dependency-path: src/dsh-ab/go.sum

      - name: go test
        working-directory: src/dsh-ab
        run: go test ./... -count=1

  build:
    name: dsh ${{ matrix.dsh_version }}
    needs: [discover, test]
    # An empty matrix is a workflow error ("Matrix vector 'dsh_version' does not contain any
    # values"), and a run whose installers are all published already has nothing to build.
    if: needs.discover.outputs.has_work == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dsh_version: ${{ fromJSON(needs.discover.outputs.versions) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Provide the build toolchain (Go 1.24.0, Inno Setup 6.7.3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # build\build.ps1 looks for the Go toolchain at <repo>\tools\go\bin\go.exe and for Inno
          # Setup at %LOCALAPPDATA%\Programs\Inno Setup 6\ISCC.exe - the same two places as on the
          # development machine, and tools\ is git-ignored. Go 那一段两个 job 都要，抽成
          # build\provision-go.ps1：版本 pin 只留在那一处，本地也能直接语法检查。
          pwsh -NoProfile -File build\provision-go.ps1

          # Inno Setup 只有这个 job 要，而且它落到 %LOCALAPPDATA%，所以留在这一行里。
          # /CURRENTUSER keeps the per-user layout build.ps1 expects.
          # Inno Setup moved its binaries to immutable GitHub releases in March 2026, so the old
          # files.jrsoftware.org/is/6/innosetup-<version>.exe path 404s now. The tag is the version
          # with dots as underscores (6.7.3 -> is-6_7_3), derived so the pin lives in one place.
          $isVersion = '6.7.3'
          $isExe = Join-Path $env:RUNNER_TEMP "innosetup-$isVersion.exe"
          $isTag = 'is-' + ($isVersion -replace '\.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$isTag/innosetup-$isVersion.exe" -OutFile $isExe -UseBasicParsing
          Start-Process -FilePath $isExe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-' -Wait
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          Write-Host "ISCC: $iscc"

      - name: Restore the payload cache (Node zip, MinGit zip, dsh trees, npm cache)
        id: payload-cache
        uses: actions/cache@v4
        with:
          path: cache
          # mkpayload.ps1 也在键里：缓存装的是它解析出来的依赖树与锁，解析策略一改，旧缓存就必须作废。
          key: payload-${{ runner.os }}-${{ matrix.dsh_version }}-${{ hashFiles('build/payload-sources.json', 'build/mkpayload.ps1') }}

      - name: Warm the payload cache from the network (cache miss only)
        if: steps.payload-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # -Offline can only run against a populated cache and a fresh runner has none, so a
          # cold cell populates it here once. Both artefacts this cell does not ship are skipped:
          # the installer and the update pack - the latter is step 5/5, which looks at
          # -SkipUpdatePack alone (build.ps1), so -SkipInstaller used to leave every cold cell
          # building a second exe and a whole update pack that are then thrown away (only the
          # installer is uploaded). The real, offline build is the next step.
          pwsh -NoProfile -File build\build.ps1 -DshVersion '${{ matrix.dsh_version }}' -SkipInstaller -SkipUpdatePack

      - name: Build the installer offline
        shell: pwsh
        run: |
          # 格子只编安装包：就地更新包与 dsh 版本无关（dsh 本体在槽里），由下面 update-pack job 单独
          # 做一份，这里用 -SkipUpdatePack 跳过。
          pwsh -NoProfile -File build\build.ps1 -DshVersion '${{ matrix.dsh_version }}' -Offline -SkipUpdatePack

      - name: Verify silently (clear -> assert empty -> silent install -> silent uninstall)
        shell: pwsh
        run: |
          # -Dir and -Iss default to the development machine's paths, so the runner overrides
          # both. Everything else in verify-silent.ps1 is relative to the checkout.
          pwsh -NoProfile -File build\verify-silent.ps1 -Dir '${{ github.workspace }}\.tmp-verify\install' -Iss '${{ github.workspace }}\installer\dsh-ab.iss'

      - name: Locate the built installer
        id: artefact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The payload manifest is the one place the expected name and versions come from, the
          # same record verify-silent.ps1 checks the built installer against.
          $mf = Get-Content -LiteralPath 'payload\payload-manifest.json' -Raw | ConvertFrom-Json
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\DSH-AB-$($mf.dshab_version)-$($mf.dsh_version)-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "installer not found: $setup" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "setup=$setup"
          Write-Host "installer: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)"
          Write-Host "sha256: $((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)"

      - name: Upload the installer as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-AB-setup-${{ matrix.dsh_version }}
          path: ${{ steps.artefact.outputs.setup }}
          if-no-files-found: error

  # 就地更新包单独一个 job，不挂在任何 matrix 格子上：一个 DSH-AB 版本只有这一份包，它与 dsh 版本
  # 无关（dsh 本体在槽里），所以只要这一轮「有工作要做」就必须被造出来。挂在格子上时，一轮里全是已经
  # 发布过的版本（matrix 整片 skipped）就没人做它，Release 里已有的那份反而被顶掉——这条已经踩过。
  update-pack:
    name: build the in-place update pack
    # test 也要：更新包里那份 exe 与安装包出自同一份源码，测试挂了就不许发出任何编译产物。
    needs: [discover, test]
    # 只看「Release 里缺这一份更新包」，不看 has_work：has_work 只数「有没有安装包要建」，dsh 版本
    # 都已经发布过时它是 false，而这恰恰是更新包最容易丢的一轮。
    if: needs.discover.outputs.update_pack_needed == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Provide the build toolchain (Go 1.24.0)
        shell: pwsh
        run: |
          # 与 build job 同一份脚本（版本 pin 只留在那一处，本地也能语法检查）。这里不装 Inno Setup：
          # 这个 job 不做安装器。
          pwsh -NoProfile -File build\provision-go.ps1

      - name: Restore the payload cache (MinGit zip)
        id: payload-cache
        uses: actions/cache@v4
        with:
          path: cache
          # 键里没有 dsh 版本，也没有 node：-ProgramOnly 的载荷只有便携 Git 要从网上取，与上游的
          # dsh 版本无关，所以这个 job 不会再因为某一个 dsh 版本的缓存键过期而去联网解析整棵 dsh 树。
          key: payload-programs-${{ runner.os }}-${{ hashFiles('build/payload-sources.json', 'build/mkpayload.ps1') }}

      - name: Warm the payload cache from the network (cache miss only)
        if: steps.payload-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # -Offline 只能对着已经灌好的缓存跑，冷 runner 上没有，所以先联网把 payload 做出来。
          # 更新包在这一步不做：它是下一步的产物，那一步才是这个 job 存在的理由。
          pwsh -NoProfile -File build\build.ps1 -DshVersion '${{ needs.discover.outputs.pack_dsh_version }}' -ProgramOnly -SkipInstaller -SkipUpdatePack

      - name: Build the in-place update pack offline
        shell: pwsh
        run: |
          # 载荷只装程序文件（-ProgramOnly）：包里本来一个 dsh 文件都没有（build\mkupdate.ps1 只取
          # exe、README/LICENSES/.gitignore 与 runtime\，docs\ 里的台账不带），所以这一步不取 node、不解析 dsh 树、
          # 也不碰 npm——上游把某个旧 dsh 从 registry 撤了，照样挡不住新版本造出更新包来。
          #
          # -DshVersion 传的是 discover 给的那个标签（本 Release 带着的某个 dsh 版本）：随包那份 exe
          # 里编着它，只为让 --version 与托盘不至于报出一个空的 dsh 版本；产物
          # dist\DSH-AB-<DSH-AB 版本>-update.zip 与它无关。
          #
          # -SkipInstaller 只跳过 4/5：5/5 更新包只看 -SkipUpdatePack，所以这个 job 既不装 Inno Setup、
          # 也不编没人要的安装包，dist 里只有这一份包。
          pwsh -NoProfile -File build\build.ps1 -DshVersion '${{ needs.discover.outputs.pack_dsh_version }}' -ProgramOnly -Offline -SkipInstaller

      - name: Upload the in-place update pack as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-AB-update
          path: ${{ github.workspace }}\dist\DSH-AB-${{ needs.discover.outputs.dshab }}-update.zip
          if-no-files-found: error

  # One release per DSH-AB version, written once and after the whole matrix: the cells must not
  # race each other into creating the same release.
  publish:
    name: publish the ${{ needs.discover.outputs.tag }} release
    needs: [discover, build, update-pack]
    # 只要这一轮真造出了东西就发：矩阵没得建（版本都已发布）而更新包做出来了，或者反过来只有安装包，
    # 都要发；两样都没有（比如 discover 就挂了）才什么都不做。某个 job 失败也一样，把做出来的那部分
    # 发出去，不连坐。
    if: ${{ !cancelled() && (needs.build.result != 'skipped' || needs.update-pack.result == 'success') }}
    runs-on: windows-latest
    steps:
      # build job 整片 skipped 时（这一轮没有待构建的格子）一个安装包 artifact 都没有，去下它会直接
      # 失败，把「只补发更新包」这条路掐死，所以没有就不下。
      - name: Download every installer this run built
        if: needs.build.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: DSH-AB-setup-*
          merge-multiple: true
          path: dist

      # update-pack job 失败时这个 artifact 根本不存在；安装包该发还是要发，所以不让它把整个 job
      # 拖垮，缺了更新包由下面那一步说出来。
      - name: Download the in-place update pack
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DSH-AB-update
          path: dist

      - name: Ensure the release exists, then upload the installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gh release view fails on purpose while the release does not exist yet.
          $PSNativeCommandUseErrorActionPreference = $false
          $repo  = '${{ github.repository }}'
          $tag   = '${{ needs.discover.outputs.tag }}'
          $dshab = '${{ needs.discover.outputs.dshab }}'
          $base = "https://github.com/$repo/releases/download/$tag"

          # 没有安装包、只有更新包不算「什么都没造出来」：一个待构建的格子都没有的那一轮补发的正是
          # 这份更新包，早退会把这条路堵死。两样都没有（每个格子都失败）才早退：空 Release 比没有
          # Release 更糟。已存在的 Release 这里不碰（说明表最后还是按真实 asset 重写）。
          $setups  = @(Get-ChildItem -LiteralPath 'dist' -File -Filter 'DSH-AB-*-setup.exe')
          $updates = @(Get-ChildItem -LiteralPath 'dist' -File -Filter 'DSH-AB-*-update.zip')
          if ($setups.Count -eq 0 -and $updates.Count -eq 0) {
            Write-Host 'neither an installer nor an update pack was built in this run, nothing to publish'
            exit 0
          }
          if ($setups.Count -eq 0) { Write-Host 'no installer was built in this run: publishing the update pack only' }
          # 更新包不在 dist 里最常见的原因是 update-pack job 被正常 skip（Release 里已经有那一份，
          # discover 因此说 update_pack_needed=false）——那不是失败，别把最常见的增量路径报成红。
          # 只有「该做却没做出来」才提醒：discover 说缺这一份，而那个 job 又没有成功退出。
          $updatePackNeeded = '${{ needs.discover.outputs.update_pack_needed }}'
          $updatePackResult = '${{ needs.update-pack.result }}'
          if ($updates.Count -eq 0 -and $updatePackNeeded -eq 'true' -and $updatePackResult -ne 'success') {
            Write-Warning "dist 里没有就地更新包，而 discover 说 Release 缺这一份（update-pack job 结果是 $updatePackResult）：这次只发安装包，Release 里已有的那份和说明表里那一行都不动"
          }

          # 版本排序只按数字：字符串排序会把 0.1.10 排到 0.1.9 前面，也会把 0.1.0-rc.7 排到
          # 0.1.7-alpha.2 前面。而 Release 页面里的 asset 列表恰恰就是按文件名排的，改不了——所以
          # 说明最上方放一张表，打开页面第一眼就是最新的那一版。
          function Get-VersionKey([string]$Version) {
            $core, $pre = $Version -split '-', 2
            $n = @(($core -split '\.') | Where-Object { $_ -ne '' } | ForEach-Object { [int]$_ })
            while ($n.Count -lt 3) { $n += 0 }
            $preKey = ''
            if ($pre) {
              # 预发布里的数字补齐到六位再比，rc.10 才不会排到 rc.9 前面。
              $preKey = (($pre -split '(\d+)') | ForEach-Object {
                if ($_ -match '^\d+$') { $_.PadLeft(6, '0') } else { $_ }
              }) -join ''
            }
            [pscustomobject]@{
              Major = $n[0]; Minor = $n[1]; Patch = $n[2]
              # 全表按「新 → 旧」排：正式版（1）排在它自己的预发布（0）前面。
              Rank = if ($pre) { 0 } else { 1 }
              Pre = $preKey
            }
          }
          # 说明表按 Release 里真实存在的 asset 生成，而不是按本轮 dist 里有什么：增量运行时本轮
          # 可能只造出一两个安装包，早就发过的那些必须继续留在表里——页面上那张下载表就是它，
          # 按本轮产物重写会把表缩成本轮那几行。
          function New-ReleaseNotes([string[]]$AssetNames) {
            $rows = @(foreach ($name in $AssetNames) {
              # 这里能直接减掉 DSH-AB 自己的版本号：它来自本次 discover，不会认错。
              if ($name -match ("^DSH-AB-" + [regex]::Escape($dshab) + "-(.+)-setup\.exe$")) {
                $dsh = $Matches[1]
                [pscustomobject]@{ Key = (Get-VersionKey $dsh); Dsh = $dsh; Name = $name }
              }
            })
            $sortKeys = @(
              @{ Expression = { $_.Key.Major }; Descending = $true },
              @{ Expression = { $_.Key.Minor }; Descending = $true },
              @{ Expression = { $_.Key.Patch }; Descending = $true },
              @{ Expression = { $_.Key.Rank };  Descending = $true },
              @{ Expression = { $_.Key.Pre };   Descending = $true }
            )
            $rows = @($rows | Sort-Object -Property $sortKeys)
            $updateName = "DSH-AB-$dshab-update.zip"

            # One element per line: Set-Content writes the array as the note text.
            $notes = @()
            $notes += "# DSH-AB $dshab"
            $notes += ''
            $notes += '## 下载（最新在最上面）'
            $notes += ''
            $notes += '| dsh 版本 | 安装包 |'
            $notes += '| --- | --- |'
            foreach ($row in $rows) {
              $notes += "| $($row.Dsh) | [$($row.Name)]($base/$($row.Name)) |"
            }
            if ($AssetNames -contains $updateName) {
              $notes += "| 就地更新包（与 dsh 版本无关） | [$updateName]($base/$updateName) |"
            }
            $notes += ''
            $notes += '> 下面的 Assets 文件列表是 GitHub 按**文件名**排序的，和版本新旧无关：要看最新版就看上面这张表。'
            $notes += ''
            $notes += "DSH-AB $dshab：本 Release 收录上游各 dsh 版本的安装包。"
            $notes += 'asset 名形如 DSH-AB-<DSH-AB 版本>-<dsh 版本>-setup.exe，两段版本分别是 DSH-AB 与 dsh 的版本。'
            $notes += 'DSH-AB-<DSH-AB 版本>-update.zip 是就地更新包：一个 DSH-AB 版本一份，与 dsh 版本无关，覆盖到安装根的程序文件上即可（槽位、dsh-ab.toml 与 docs\ 里累计的台账都不受影响）。'
            $notes += '上游出新版本（alpha / rc / 正式版都算）时由本工作流自动构建并加进来，已经在这里的版本不重复构建。'
            $notes += 'Windows x64，安装包未做代码签名。'
            Write-Host "notes table: $($rows.Count) installer row(s) + $(if ($AssetNames -contains $updateName) { 1 } else { 0 }) update pack row(s), out of $($AssetNames.Count) asset name(s)"
            return $notes
          }

          $null = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists, uploading into it"
          } else {
            # 新建的 Release 先按「即将上传的这些文件」写一份说明，中途失败也不至于留下空正文；
            # 上传完成后下面还会按真实清单再写一次。
            $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -LiteralPath $notesFile -Value (New-ReleaseNotes (@($setups.Name) + @($updates.Name))) -Encoding utf8
            gh release create $tag --repo $repo --title "DSH-AB $dshab" --latest --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $tag" }
          }

          foreach ($file in (@($setups) + @($updates))) {
            Write-Host "uploading $($file.Name)"
            gh release upload $tag $file.FullName --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $($file.Name)" }
          }

          # 上传之后按这个 Release 的真实 asset 清单重写说明：本轮没造出来的安装包与更新包，
          # 只要它们的 asset 还在这里，就继续留在表里。
          $releaseId = (gh api "repos/$repo/releases/tags/$tag" --jq '.id').Trim()
          $assetNames = @(gh api "repos/$repo/releases/$releaseId/assets?per_page=100" --paginate --jq '.[].name')
          if ($assetNames.Count -eq 0) { throw "release $tag has no asset even after the upload" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value (New-ReleaseNotes $assetNames) -Encoding utf8
          gh release edit $tag --repo $repo --latest --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed: $tag" }
          Write-Host "$($setups.Count) installer(s) and $($updates.Count) update pack(s) uploaded; release $tag now holds $($assetNames.Count) asset(s)"
